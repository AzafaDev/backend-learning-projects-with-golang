<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { border-bottom: 2px solid #222; padding-bottom: 8px; }
  .new-article-link { display: inline-block; margin-bottom: 20px; padding: 8px 16px; background: #1a1aee; color: #fff; text-decoration: none; border-radius: 4px; }
  .new-article-link:hover { background: #1414c2; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #ddd; }
  th { color: #666; font-size: 0.85rem; text-transform: uppercase; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .edit-link { color: #1a1aee; text-decoration: none; }
  .edit-link:hover { text-decoration: underline; }
  .delete-form button { background: #c62828; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
  .delete-form button:hover { background: #a02020; }
  .empty-state { color: #666; font-style: italic; }
</style>
</head>
<body>

<h1>Admin Dashboard</h1>

<a class="new-article-link" href="/admin/articles/new">+ Buat Artikel Baru</a>

<table>
  <thead>
    <tr>
      <th>Judul</th>
      <th>Tanggal Publish</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody>
    {{range .}}
    <tr>
      <td>{{.Title}}</td>
      <td>{{.PublishedAt}}</td>
      <td class="actions">
        <a class="edit-link" href="/admin/articles/{{.Slug}}/edit">Edit</a>
        <form class="delete-form" method="POST" action="/admin/articles/{{.Slug}}/delete">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>

</body>
</html>
