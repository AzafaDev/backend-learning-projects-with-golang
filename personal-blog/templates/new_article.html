<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Article</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { border-bottom: 2px solid #222; padding-bottom: 8px; }
  .back-link { display: inline-block; margin-bottom: 20px; color: #1a1aee; text-decoration: none; }
  .back-link:hover { text-decoration: underline; }
  form { display: flex; flex-direction: column; gap: 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: bold; }
  input, textarea { font: inherit; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  textarea { min-height: 200px; resize: vertical; }
  button { align-self: flex-start; padding: 10px 20px; background: #1a1aee; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
  button:hover { background: #1414c2; }
</style>
</head>
<body>

<a class="back-link" href="/admin">&larr; Back to dashboard</a>

<h1>New Article</h1>

<form method="POST" action="/admin/articles/new">
  <label>
    Title
    <input type="text" name="title" required>
  </label>

  <label>
    Content
    <textarea name="content" required></textarea>
  </label>

  <label>
    Published Date
    <input type="date" name="published_at" required>
  </label>

  <button type="submit">Save Article</button>
</form>

</body>
</html>
