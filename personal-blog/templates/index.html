<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Blog</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { border-bottom: 2px solid #222; padding-bottom: 8px; }
  .article-list { list-style: none; padding: 0; }
  .article-item { padding: 16px 0; border-bottom: 1px solid #ddd; }
  .article-item h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .article-item a { text-decoration: none; color: #1a1aee; }
  .article-item a:hover { text-decoration: underline; }
  .published-date { color: #666; font-size: 0.85rem; }
  .empty-state { color: #666; font-style: italic; }
</style>
</head>
<body>

<h1>My Blog</h1>
<ul class="article-list">
  {{range .}}
  <li class="article-item">
    <h2><a href="/articles/{{.Slug}}">{{.Title}}</a></h2>
    <span class="published-date">Published: {{.PublishedAt.Format "2006-01-02" }}</span>
  </li>
  {{end}}
</ul>

</body>
</html>
