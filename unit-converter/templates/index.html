<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unit Converter</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs a { padding: 8px 16px; text-decoration: none; border: 1px solid #ccc; color: #333; }
  .tabs a.active { background: #333; color: #fff; }
  form { display: flex; flex-direction: column; gap: 12px; }
  .error { color: red; }
  .result { font-weight: bold; }
</style>
</head>
<body>

<div class="tabs">
  <a href="/?category=length" class="{{if eq .ActiveCategory "length"}}active{{end}}">Length</a>
  <a href="/?category=weight" class="{{if eq .ActiveCategory "weight"}}active{{end}}">Weight</a>
  <a href="/?category=temperature" class="{{if eq .ActiveCategory "temperature"}}active{{end}}">Temperature</a>
</div>

<form method="POST" action="/">
  <input type="hidden" name="category" value="{{.ActiveCategory}}">

  <label>
    Value
    <input type="number" step="any" name="value" value="{{.Value}}" required>
  </label>

  <label>
    From
    <select name="from">
      {{range .Units}}
        <option value="{{.}}" {{if eq . $.From}}selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </label>

  <label>
    To
    <select name="to">
      {{range .Units}}
        <option value="{{.}}" {{if eq . $.To}}selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </label>

  <button type="submit">Convert</button>
</form>

{{if .Error}}
  <p class="error">{{.Error}}</p>
{{end}}

{{if not .Error}}
  {{if .Result}}
    <p class="result">Result: {{.Result}}</p>
  {{end}}
{{end}}

</body>
</html>
